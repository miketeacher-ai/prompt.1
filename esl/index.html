header{background:#0f172a;color:#fff;padding:44px 20px;text-align:center}

.pill{display:inline-block;background:#1e293b;border:1px solid #334155;color:#cbd5e1;font-size:.72rem;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.switch{display:flex;gap:8px;justify-content:center;margin:-22px 0 12px;flex-wrap:wrap}

.bar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;margin-top:10px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.82rem;margin:6px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:50px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.num{width:30px;height:30px;border-radius:9px;background:#eef2ff;color:var(--ac);font-weight:800;display:grid;place-items:center;font-size:.8rem}

.copy.done{background:#16a34a}

.custom{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.checklist{margin-top:2px}

let lib="esl",cat="all";
const CATC={"esl-f":["#e0f2fe","#0369a1","#bae6fd"],"esl-g":["#ede9fe","#6d28d9","#ddd6fe"],"esl-v":["#fef3c7","#b45309","#fde68a"],"esl-r":["#ffe4e6","#be123c","#fecdd3"],"esl-w":["#d1fae5","#047857","#a7f3d0"],"esl-s":["#ffedd5","#c2410c","#fed7aa"]};
function initLib(){
document.getElementById("lib").innerHTML=Object.entries(LIBS).map(([k,v])=>`<button class="${k===lib?"on":""}" onclick="setLib('${k}')">${v.name}</button>`).join("");
const cats=LIBS[lib].cats;
document.getElementById("tabs").innerHTML=`<div class="tab ${cat==="all"?"on":""}" onclick="setCat('all')">All</div>`+Object.entries(cats).map(([k,v])=>{const cc0=CATC[k]||["#eef2ff","#4f46e5","#e0e7ff"];const st=k===cat?";background:"+cc0[1]+";border-color:"+cc0[1]+";color:#fff":";border-color:"+cc0[2];return '<div class="tab '+(k===cat?"on":"")+'" style="'+st+'" onclick="setCat(\''+k+'\')"><span class="dot" style="background:'+cc0[1]+'"></span>'+v+'</div>';}).join("");
}
function setLib(k){lib=k;cat="all";initLib();render();}
function setCat(k){cat=k;initLib();render();}
function useKey(l,c,n){return "use_"+l+"_"+c+"_"+n;}
function useTsKey(l,c,n){return "usets_"+l+"_"+c+"_"+n;}
function getUse(l,c,n){return {n:parseInt(localStorage.getItem(useKey(l,c,n))||"0",10),ts:localStorage.getItem(useTsKey(l,c,n))||""};}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);}function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t);});}fallbackCopy(t);return Promise.resolve();}
let openCk=new Set();let openPf=new Set();
function toggleList(btn,key){const id="ck-"+key.replaceAll("|","-");const el=document.getElementById(id);const show=el.style.display==="none";el.style.display=show?"flex":"none";if(show)openCk.add(key);else openCk.delete(key);}
let hideUsed=false;let useCache={};let rT=null;function queueRender(){clearTimeout(rT);rT=setTimeout(render,150);}function useCached(d){const k=d[0]+"|"+d[1]+"|"+d[2];if(!useCache[k])useCache[k]=getUse(d[0],d[1],d[2]);return useCache[k];}
function setUse(l,c,n,val){val=Math.max(0,val);const y=window.scrollY;localStorage.setItem(useKey(l,c,n),String(val));if(val>0)localStorage.setItem(useTsKey(l,c,n),new Date().toLocaleString());else localStorage.removeItem(useTsKey(l,c,n));render();window.scrollTo(0,y);}
function logUse(key){const [l,c,n]=key.split("|");const u=getUse(l,c,n);setUse(l,c,n,u.n+1);}
function undoUse(key){const [l,c,n]=key.split("|");const u=getUse(l,c,n);setUse(l,c,n,u.n-1);}
function resetUse(key){const [l,c,n]=key.split("|");const y=window.scrollY;localStorage.removeItem(useKey(l,c,n));localStorage.removeItem(useTsKey(l,c,n));openCk.delete(key);render();window.scrollTo(0,y);}
function clickBox(key,i){const [l,c,n]=key.split("|");const u=getUse(l,c,n);setUse(l,c,n,(u.n===i+1)?i:i+1);}
function parsePrompt(t){try{const m=t.match(/^Act as (.+?)\. Audience: (.+?)\. Duration: (.+?)\. TASK: ([\s\S]+?) LEARNING OBJECTIVES:/);if(m)return{role:m[1],aud:m[2],dur:m[3],task:m[4]};}catch(e){}return{role:"Instructor",aud:"—",dur:"—",task:t.slice(0,140)};}
function fmtSec(label,body){return '<div class="fsec"><div class="flabel">'+label+'</div><div>'+body+'</div></div>';}
function formatPrompt(t){var h='';var pr=parsePrompt(t);h+='<div class="fmeta">ROLE: <b>'+pr.role+'</b> &middot; '+pr.aud+' &middot; '+pr.dur+'</div>';h+='<div class="fsec"><div class="flabel">TASK (what it teaches)</div><div style="font-size:.85rem;background:#eef2ff;border:1px solid #e0e7ff;border-radius:9px;padding:8px 10px">'+pr.task+'</div></div>';var om=t.match(/LEARNING OBJECTIVES:\s*([\s\S]+?)(?=OUTPUT\s*[\u2014-])/);if(om){h+=fmtSec('OBJECTIVES',om[1].trim());}var outm=t.match(/OUTPUT\s*[\u2014-]\s*([\s\S]+?)(?=WEBPAGE OUTPUT:)/);if(outm){var seg=outm[1].split(/\s*(?=[123]\)\s)/);if(seg.length>=4){h+='<div class="fsec"><div class="flabel">OUTPUT &mdash; 3 SECTIONS</div><div class="fgrid">';var titles={'1':'1 &middot; STUDY NOTES','2':'2 &middot; EXERCISES','3':'3 &middot; MINI-MOCK EXAM'};for(var k=1;k<=3;k++){var s=seg[k]||'';var body=s.replace(/^\d\)\s*/,'').replace(/^(STUDY NOTES|EXERCISES|MINI-MOCK EXAM)\s*/, '');h+='<div class="fbox"><b>'+titles[String(k)]+'</b>'+body.trim()+'</div>';}h+='</div></div>';}else{h+=fmtSec('OUTPUT',outm[1].trim());}}var web=t.match(/WEBPAGE OUTPUT:\s*([\s\S]+?)(?=[A-Z0-9 \/-]*DEPTH:\s*|QUALITY RULES:)/);if(web){h+=fmtSec('WEBPAGE OUTPUT',web[1].trim());}var dep=t.match(/([A-Z0-9 \/-]*DEPTH:\s*[\s\S]+?)(?=QUALITY RULES:)/);if(dep){h+='<div class="fmute">'+dep[1].trim()+'</div>';}var qr=t.match(/QUALITY RULES:\s*([\s\S]+)$/);if(qr){h+='<div class="fmute">QUALITY: '+qr[1].trim()+'</div>';}return h;}
function ensurePf(id,key){const b=document.getElementById("pf-"+id);if(!b||b.dataset.done)return false;const p=key.split("|");const it=DATA.find(d=>d[0]===p[0]&&d[1]===p[1]&&String(d[2])===String(p[2]));if(!it)return false;b.innerHTML=formatPrompt(it[4])+'<div style="margin-top:8px"><button class="pbtn" onclick="copyBtn(this,\''+key+'\')">Copy this prompt</button></div>';b.dataset.done="1";return true;}
function togglePrompt(id,key,btn){const a=document.getElementById("ps-"+id),b=document.getElementById("pf-"+id);const open=b.style.display==="none";if(open){ensurePf(id,key);openPf.add(key);}else{openPf.delete(key);}b.style.display=open?"block":"none";a.style.display=open?"none":"inline";btn.textContent=open?"Show less":"Show full prompt";btn.setAttribute("aria-expanded",open?"true":"false");}
function render(){
useCache={};
const q=document.getElementById("q").value.toLowerCase();
let f=DATA.filter(d=>d[0]===lib&&(cat==="all"||d[1]===cat)&&(d[3].toLowerCase().includes(q)||d[4].toLowerCase().includes(q)));
if(hideUsed)f=f.filter(d=>useCached(d).n===0);
let usedTotal=0;for(const d of f){if(useCached(d).n>0)usedTotal++;}
let allUsed=0;for(const d of DATA){if(useCached(d).n>0)allUsed++;}
document.getElementById("count").textContent=`Showing ${f.length} prompts • Used ${usedTotal}/${f.length} • Total used ${allUsed}/${DATA.length} • ${LIBS[lib].name}`;
const pct=Math.round(allUsed/DATA.length*100);const pfel=document.getElementById("pfill");if(pfel){pfel.style.width=pct+"%";pfel.textContent=pct>=12?pct+"%":"";}
document.getElementById("grid").innerHTML=f.map(d=>{const key=d[0]+"|"+d[1]+"|"+d[2];const kid=key.replaceAll("|","-");const pr=parsePrompt(d[4]);const cc=CATC[d[1]]||["#eef2ff","#4f46e5","#e0e7ff"];const u=useCached(d);const filled=Math.min(u.n,5);const status=u.n===0?"○ Unused":"● Used "+u.n+"×";let boxes="";for(let i=0;i<5;i++){boxes+=`<button onclick="clickBox('${key}',${i})" title="Use ${i+1}" style="width:34px;height:34px;border-radius:9px;border:1px solid ${i<filled?"#4f46e5":"var(--line)"};background:${i<filled?"#4f46e5":"#f8fafc"};color:${i<filled?"#fff":"#94a3b8"};font-weight:800;cursor:pointer">${i<filled?"✓":i+1}</button>`;}return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><div class="num" style="background:${cc[0]};color:${cc[1]}">${d[2]}</div><div class="cat" style="background:${cc[0]};color:${cc[1]};border:1px solid ${cc[2]};padding:3px 9px;border-radius:999px">${LIBS[d[0]].cats[d[1]]||d[1]}</div><div class="usebadge" style="margin-left:auto;font-size:.72rem;font-weight:800;color:${u.n>0?"#047857":"#94a3b8"};background:${u.n>0?"#ecfdf5":"#f1f5f9"};padding:3px 10px;border-radius:999px">${status}</div></div><h3>${d[3]}</h3><div class="prompt"><span id="ps-${kid}"><div class="genrow">🎭 <b>${pr.role}</b></div><div class="genrow" style="color:var(--mut)">${pr.aud} · ⏱ ${pr.dur}</div><div class="genrow">🎯 ${pr.task.slice(0,160)}…</div><div class="outgrid"><div class="outbox ob-n">📝 <b>Study Notes</b>1 page + key terms</div><div class="outbox ob-e">✏️ <b>Exercises ×12</b>answer key + traps</div><div class="outbox ob-m">⏱️ <b>Mini-Mock</b>timed + scoring</div><div class="outbox ob-w">🌐 <b>Webpage</b>HTML + CSS + JS + JSON</div></div></span><span id="pf-${kid}" style="display:none"></span><div style="margin-top:8px"><button id="pb-${kid}" class="pbtn" onclick="togglePrompt('${kid}','${key}',this)" aria-expanded="false">Show full prompt</button></div></div><div style="display:flex;gap:8px"><button class="copy" style="flex:2" onclick="copyBtn(this,'${d[0]}|${d[1]}|${d[2]}')">Copy + Log use</button><button id="ckbtn-${kid}" class="checkbtn" style="flex:1" onclick="toggleList(this,'${key}')">▣ Uses (${u.n})</button></div><div id="ck-${kid}" class="checklist" style="display:none;flex-direction:column;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px"><div style="font-size:.78rem;color:var(--mut)">Tick = a use. ${u.n>0?"Last used: "+u.ts:"Never used yet."}</div><div style="display:flex;gap:6px">${boxes}</div><div style="display:flex;gap:6px"><button onclick="logUse('${key}')" style="flex:1;background:#0f172a;color:#fff;border:0;border-radius:8px;padding:8px;cursor:pointer;font-weight:700">+ Log use</button><button onclick="undoUse('${key}')" style="flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer">Undo</button><button onclick="resetUse('${key}')" style="background:none;border:0;color:var(--mut);font-size:.75rem;cursor:pointer">Reset</button></div></div></div>`;}).join("");
openCk.forEach(k=>{const el=document.getElementById("ck-"+k.replaceAll("|","-"));if(el)el.style.display="flex";});
openPf.forEach(k=>{const kid=k.replaceAll("|","-");const a=document.getElementById("ps-"+kid),b=document.getElementById("pf-"+kid);if(a&&b){ensurePf(kid,k);b.style.display="block";a.style.display="none";const pb=document.getElementById("pb-"+kid);if(pb){pb.textContent="Show less";pb.setAttribute("aria-expanded","true");}}});
if(!f.length){document.getElementById("grid").innerHTML='<div style="background:#fff;border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--mut)">No prompts match. Try clearing search or switching library.</div>';}
}
function copyBtn(b,key){
const [l,c,n]=key.split("|");
const it=DATA.find(d=>d[0]===l&&d[1]===c&&String(d[2])===String(n));
const full=it[4]+"\n\nAlways output BOTH: (A) the 3 sections as readable text AND (B) one single self-contained webpage file (index.html) with embedded CSS in a style tag, JS in a script tag, and a JSON data block for questions/answers. The webpage must have 3 tabs: 1. STUDY NOTES 2. EXERCISES with instant checking + score 3. TIMED MINI-MOCK with countdown, auto-score, answer review. Responsive clean UI, no external dependencies, runnable by double-click.";
copyText(full);
const u=getUse(l,c,n);const y=window.scrollY;localStorage.setItem(useKey(l,c,n),String(u.n+1));localStorage.setItem(useTsKey(l,c,n),new Date().toLocaleString());
b.textContent="Copied ✓ ("+(u.n+1)+"×)";b.classList.add("done");setTimeout(()=>{render();window.scrollTo(0,y);},1200);
}
initLib();render();
</script>
